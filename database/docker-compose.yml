
services:
  postgres:
    image: postgres:16-alpine
    container_name: izone_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Izone@2026!}
      POSTGRES_DB: ${DB_NAME:-izone_dashboard}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - izone_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: izone_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@izone.edu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - izone_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:

networks:
  izone_network:
    driver: bridge
